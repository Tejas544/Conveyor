name: conveyor

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [conveyor]

# ARCHITECTURE.md §11 — always applied, not gated behind `--profile observability`,
# so every log line carries traceId/spanId (the Phase 9 exit criterion) regardless
# of whether Tempo is actually up to receive the export; an unreachable OTLP
# endpoint just means spans are generated and MDC-enriched but never shipped
# anywhere, which is harmless (async, fire-and-forget batch export).
x-tracing-env: &tracing-env
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_local_dev_only}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_service}
      ORDER_DB_USER: ${ORDER_DB_USER:-order_service}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_service_local_dev_only}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_service}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory_service}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_service_local_dev_only}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_service}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_service}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_service_local_dev_only}
      SAGA_DB_NAME: ${SAGA_DB_NAME:-saga_orchestrator}
      SAGA_DB_USER: ${SAGA_DB_USER:-saga_orchestrator}
      SAGA_DB_PASSWORD: ${SAGA_DB_PASSWORD:-saga_orchestrator_local_dev_only}
      DISPATCH_DB_NAME: ${DISPATCH_DB_NAME:-dispatch_service}
      DISPATCH_DB_USER: ${DISPATCH_DB_USER:-dispatch_service}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-dispatch_service_local_dev_only}
      VERIFIER_DB_USER: ${VERIFIER_DB_USER:-conveyor_verifier}
      VERIFIER_DB_PASSWORD: ${VERIFIER_DB_PASSWORD:-verifier_local_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-service-databases.sh:/docker-entrypoint-initdb.d/init-service-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *service-defaults

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-conveyor}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_local_dev_only}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *service-defaults

  redpanda:
    # ADR-2: Redpanda is the default local broker; Apache Kafka is exercised
    # separately by the kafka-compat CI job, never by the everyday dev loop.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    <<: *service-defaults

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${ORDER_DB_NAME:-order_service}
      DB_USERNAME: ${ORDER_DB_USER:-order_service}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_service_local_dev_only}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SEED_OPS_USERNAME: ${SEED_OPS_USERNAME:-ops}
      SEED_OPS_PASSWORD: ${SEED_OPS_PASSWORD:-ops_local_dev_only}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin_local_dev_only}
      CONVEYOR_SECURITY_JWT_PRIVATE_KEY_PEM: ${CONVEYOR_SECURITY_JWT_PRIVATE_KEY_PEM:-}
      # Local dev serves the stack over plain http://localhost; a Secure cookie would never
      # reach the browser there. Real deployments (behind HTTPS) leave this unset (default true).
      CONVEYOR_SECURITY_JWT_COOKIE_SECURE: "false"
      <<: *tracing-env
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    <<: *service-defaults

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${INVENTORY_DB_NAME:-inventory_service}
      DB_USERNAME: ${INVENTORY_DB_USER:-inventory_service}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_service_local_dev_only}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-conveyor}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_local_dev_only}@mongo:27017/inventory_service?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      <<: *tracing-env
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    <<: *service-defaults

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${PAYMENT_DB_NAME:-payment_service}
      DB_USERNAME: ${PAYMENT_DB_USER:-payment_service}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_service_local_dev_only}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Base gateway failure rates (ARCHITECTURE.md §3.3), 0 by default — unrelated to and not
      # gated by the `chaos` profile's POST /test/failure-mode. Overridden by the e2e module's
      # PaymentDeclineCompensationE2ETest to trigger the payment-declined compensation path for
      # real, over the public REST API, without touching the chaos profile at all.
      CONVEYOR_PAYMENT_GATEWAY_DECLINE_RATE: ${CONVEYOR_PAYMENT_GATEWAY_DECLINE_RATE:-0}
      # PLAN.md Phase 8's dashboard ships a "make this one fail" control that calls POST
      # /test/failure-mode -- that control is only real if this service actually runs with the
      # `chaos` profile locally. The ChaosProfileStartupGuard (conveyor-common) still refuses to
      # start if `prod` is ever active alongside it, so this is safe to default on for local/demo
      # use. Override with an empty value to run without it.
      SPRING_PROFILES_ACTIVE: ${PAYMENT_SERVICE_PROFILES:-chaos}
      <<: *tracing-env
    ports:
      - "8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    <<: *service-defaults

  saga-orchestrator:
    build:
      context: .
      dockerfile: saga-orchestrator/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${SAGA_DB_NAME:-saga_orchestrator}
      DB_USERNAME: ${SAGA_DB_USER:-saga_orchestrator}
      DB_PASSWORD: ${SAGA_DB_PASSWORD:-saga_orchestrator_local_dev_only}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      <<: *tracing-env
    ports:
      - "8084:8084"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    <<: *service-defaults

  dispatch-service:
    build:
      context: .
      dockerfile: dispatch-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${DISPATCH_DB_NAME:-dispatch_service}
      DB_USERNAME: ${DISPATCH_DB_USER:-dispatch_service}
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-dispatch_service_local_dev_only}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-conveyor}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_local_dev_only}@mongo:27017/dispatch_service?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      <<: *tracing-env
    ports:
      - "8085:8085"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    <<: *service-defaults

  # ARCHITECTURE.md §11/§15.1 — Prometheus + Grafana + Tempo, behind
  # `--profile observability` so the default `docker compose up` stays light.
  # The five app services above always emit metrics/traces (see x-tracing-env);
  # this profile only controls whether anything is listening to receive them.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    <<: *service-defaults

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    <<: *service-defaults

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Not nested under the mount above — see dashboards.yml's comment (BUGS.md).
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards-json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }
    <<: *service-defaults

networks:
  conveyor: {}

volumes:
  postgres-data: {}
  mongo-data: {}
  prometheus-data: {}
  tempo-data: {}
  grafana-data: {}
