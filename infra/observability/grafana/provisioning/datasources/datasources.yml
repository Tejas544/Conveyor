apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: ""
      # Correlate a trace's service.name span attribute back to Prometheus's own
      # `application` meter tag (management.metrics.tags.application), so a Tempo
      # trace view can jump straight to that service's dashboard.
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: "service.name", value: "application" }]
