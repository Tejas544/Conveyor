# ARCHITECTURE.md §11 / §15.1 — Prometheus scrape config for the `observability`
# docker-compose profile. Scrapes each of the five services' own
# /actuator/prometheus endpoint directly (no service discovery needed at this
# scale); `job`/`instance` labels distinguish services alongside the
# `application` tag each meter already carries (management.metrics.tags.application).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8082"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]

  - job_name: saga-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["saga-orchestrator:8084"]

  - job_name: dispatch-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dispatch-service:8085"]

  # PLAN.md Phase 10 — conveyor-invariant_violations_total's source (see alert-rules.yml's
  # InvariantViolation rule, written in Phase 9 ahead of this metric existing).
  - job_name: conveyor-verifier
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["conveyor-verifier:8086"]
