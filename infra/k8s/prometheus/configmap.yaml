# Phase 15: kubernetes_sd_configs (role: pod), namespaced to `conveyor`, keeping only pods
# carrying the prometheus.io/scrape="true" annotation the app Deployment template now sets
# (infra/helm/conveyor/templates/app/deployment.yaml) — every app-service pod, at whatever replica
# count an HPA has it at, scraped individually and labelled with its own pod name so a per-replica
# breakdown is possible later, not just an aggregate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: conveyor-prometheus-config
  namespace: conveyor
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: conveyor-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["conveyor"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app
