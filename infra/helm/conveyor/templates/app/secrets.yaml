# One shared Secret for everything that isn't a plain per-service DB credential (those live in
# postgres-credentials, templates/postgres/secret.yaml): JWT keys and the two Mongo connection
# strings inventory-service/dispatch-service need. Composite connection strings (embedded
# username:password) can't be assembled from two separate env vars at the Pod level — Kubernetes
# has no env-to-env interpolation — so they're rendered once, here, from the same values.yaml
# credentials mongo-credentials already uses, same trust boundary as every other *_DB_PASSWORD key
# already being stringData'd directly from values in this chart.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "conveyor.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_PUBLIC_KEY_PEM: {{ .Values.jwt.publicKeyPem | quote }}
  JWT_PRIVATE_KEY_PEM: {{ .Values.jwt.privateKeyPem | quote }}
  {{- range $svcName, $svc := .Values.services }}
  {{- if $svc.mongoDb }}
  MONGO_URI_{{ $svcName | replace "-" "_" | upper }}: "mongodb://{{ $.Values.mongo.rootUsername }}:{{ $.Values.mongo.rootPassword }}@mongo:27017/{{ $svc.mongoDb }}?authSource=admin"
  {{- end }}
  {{- end }}
