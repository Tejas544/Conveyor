# PLAN.md Phase 13/15: order-service gets a CPU HPA (the metric that needs nothing beyond
# metrics-server, already installed by scripts/kind-up.sh). saga-orchestrator gets a custom-metric
# HPA on conveyor_saga_active (Phase 6/9's own gauge) via prometheus-adapter's external.metrics.k8s.io
# API (infra/k8s/prometheus/adapter-values.yaml) — deliberately a second, different kind of metric
# from order-service's CPU one, per PLAN.md Phase 15's own goal: "one infrastructure-metric and one
# application-metric autoscaler, because they behave differently and the difference is worth
# showing." `$svc.hpa.metric` selects which `metrics:` entry this HPA gets; default is `cpu` so
# order-service's block (and any future CPU-scaled service) needs no values.yaml change.
{{- $root := . -}}
{{- range $svcName, $svc := .Values.services }}
{{- if and $svc.hpa $svc.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svcName }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svcName }}
    {{- include "conveyor.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svcName }}
  minReplicas: {{ $svc.hpa.minReplicas }}
  maxReplicas: {{ $svc.hpa.maxReplicas }}
  metrics:
    {{- if eq ($svc.hpa.metric | default "cpu") "external" }}
    - type: External
      external:
        metric:
          name: {{ $svc.hpa.externalMetricName }}
        target:
          type: Value
          value: {{ $svc.hpa.targetValue }}
    {{- else }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.targetCPUUtilizationPercentage }}
    {{- end }}
---
{{- end }}
{{- end }}
