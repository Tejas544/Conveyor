{{- $root := . -}}
{{- range $svcName, $svc := .Values.services }}
{{- $db := index $root.Values.postgres.databases $svc.db }}
{{- $dbKeyUpper := $svc.db | upper }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svcName }}
    {{- include "conveyor.labels" $root | nindent 4 }}
spec:
  {{- if not (and $svc.hpa $svc.hpa.enabled) }}
  # Omitted (not just left at replicaCount) when an HPA owns this Deployment: Kubernetes defaults
  # a brand-new Deployment's replicas to 1 if the field is absent at creation, and thereafter the
  # HPA's scale-subresource writes are the only thing setting it. Helm's server-side apply and the
  # HPA controller both claiming ownership of an explicit `replicas:` here is exactly what produced
  # a live field-manager conflict this phase (BUG-0034) the moment order-service's HPA scaled it.
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svcName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svcName }}
        {{- include "conveyor.labels" $root | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{ $svcName }}
          image: "{{ $root.Values.image.repository }}/{{ $svcName }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- include "conveyor.securityContext" $root | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: {{ $db.name | quote }}
            - name: DB_USERNAME
              value: {{ $db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: {{ $dbKeyUpper }}_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $root.Values.kafka.bootstrapServers | quote }}
            - name: CONVEYOR_SECURITY_JWT_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_PUBLIC_KEY_PEM
            {{- if $svc.jwtIssuer }}
            - name: CONVEYOR_SECURITY_JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_PRIVATE_KEY_PEM
            # kind has no TLS ingress in front of it (ARCHITECTURE.md §12's TLS-at-the-ALB posture
            # is a deployed-path concern, Phase 14+) — same reasoning docker-compose.yml's own
            # comment gives for this exact override.
            - name: CONVEYOR_SECURITY_JWT_COOKIE_SECURE
              value: "false"
            {{- end }}
            {{- if $svc.mongoDb }}
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_URI_{{ $svcName | replace "-" "_" | upper }}
            {{- end }}
            {{- if eq $svcName "payment-service" }}
            - name: CONVEYOR_PAYMENT_GATEWAY_DECLINE_RATE
              value: "0"
            {{- end }}
            {{- if $svc.profiles }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $svc.profiles | quote }}
            {{- end }}
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: {{ $root.Values.tracing.samplingProbability | quote }}
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: {{ $root.Values.tracing.otlpEndpoint | quote }}
            - name: CONVEYOR_CHAOS_CRASH_AT
              value: {{ $root.Values.chaos.crashAt | quote }}
            - name: CONVEYOR_CHAOS_CRASH_PROBABILITY
              value: {{ $root.Values.chaos.crashProbability | quote }}
            - name: CONVEYOR_CHAOS_DELAY_AT
              value: {{ $root.Values.chaos.delayAt | quote }}
          {{- include "conveyor.probes" $root | nindent 10 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svcName }}
    {{- include "conveyor.labels" $root | nindent 4 }}
spec:
  {{- if $svc.external }}
  type: NodePort
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $svcName }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      {{- if $svc.external }}
      nodePort: {{ add $svc.port 22000 }}
      {{- end }}
---
{{- end }}
