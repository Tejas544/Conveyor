apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mongo
    {{- include "conveyor.labels" . | nindent 4 }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        {{- include "conveyor.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports:
            - name: mongo
              containerPort: 27017
          envFrom:
            - secretRef:
                name: mongo-credentials
          # BUG-0045: no initialDelaySeconds at all meant the livenessProbe's first check fired
          # ~10s after container start with only 6 failures (~70s total) tolerated before a kill --
          # fine on a fast/warm local dev host, not on a freshly-provisioned dynamic PV on a kind
          # node under real CI resource contention, where MongoDB's own first-time root-user
          # creation was still in progress when the probe killed it mid-init. The restart then left
          # a half-initialized data directory that authentication could never succeed against again.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongo.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "conveyor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
